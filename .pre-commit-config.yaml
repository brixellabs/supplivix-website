# Pre-commit git hooks configuration for Supplivix monorepo.
# Ensures zero emojis, ruff linting/formatting, and eslint/prettier compliance.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, jsx, css, json, markdown]
        exclude: ^(frontend/dist/|frontend/node_modules/|backend/\.venv/)

  - repo: local
    hooks:
      - id: eslint
        name: ESLint (Frontend)
        entry: bash -c "cd frontend && npm run lint"
        language: system
        files: ^frontend/src/.*\.(js|jsx)$
        pass_filenames: false

      - id: check-no-emojis
        name: Supplivix Zero-Emoji Policy Checker
        entry: node frontend/scripts/check-no-emojis.js
        language: system
        pass_filenames: false
